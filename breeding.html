<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Snake Room - Breeding</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="page-container">
        <div class="hero-section">
            <img src="Images/TheSnakeRoom.jpg" class="hero-image" alt="The Snake Room logo">

            <div class="container">
                <h1>The Snake Room</h1>
                <h2>Breeding Page</h2>
            </div>
        </div>

        <div class="button-row">
            <a href="index.html" class="main-button">Home</a>
            <a href="snakes.html" class="main-button">Collection</a>
            <a href="morphCalculator.html" class="main-button">Morph Calculator</a>
            <a href="available.html" class="main-button">Available</a>
            <a href="cloud-sync.html" class="main-button">Cloud Sync</a>
        </div>

        <div class="divider"></div>

        <main class="snake-form-page">
            <section class="form-section" id="clutches">
                <h3>Breeding Pair</h3>

                <div class="form-grid">
                    <label class="form-field">
                        <span>Female</span>
                        <select id="femaleSelect"></select>
                    </label>

                    <label class="form-field">
                        <span>Male</span>
                        <select id="maleSelect"></select>
                    </label>

                    <label class="form-field">
                        <span>Pairing Date</span>
                        <input type="date" id="pairingDateInput">
                    </label>

                    <label class="form-field">
                        <span>Ovulation Date</span>
                        <input type="date" id="ovulationDateInput">
                    </label>

                    <label class="form-field checkbox-field">
                        <span>Ovulation Observed</span>
                        <input type="checkbox" id="ovulationObservedInput">
                    </label>

                    <label class="form-field">
                        <span>Pre-Lay Shed</span>
                        <input type="date" id="preLayShedDateInput">
                    </label>

                    <label class="form-field">
                        <span>Eggs Laid Date</span>
                        <input type="date" id="eggsLaidDateInput">
                    </label>

                    <label class="form-field">
                        <span>Egg Count</span>
                        <input type="number" id="eggCountInput" min="0" placeholder="Number of eggs">
                    </label>
                </div>

                <div class="form-page-actions">
                    <button type="button" class="main-button" onclick="saveBreedingPair()">
                        Save Pair
                    </button>
                </div>
            </section>

            <section class="form-section">
                <h3>Active Pairs</h3>
                <div id="breedingPairsList" class="breeding-list">
                    <p class="empty-message">No breeding pairs yet.</p>
                </div>
            </section>

            <section class="form-section">
                <h3>Clutches</h3>
                <div id="clutchList" class="breeding-list">
                    <p class="empty-message">No clutches yet.</p>
                </div>
            </section>
        </main>
    </div>

    <script src="data-helpers.js"></script>
    <script src="breeding.js"></script>
</body>

</html>
