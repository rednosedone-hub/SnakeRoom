<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a0a0a">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Snake Room - Data Tools</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="page-container">
        <div class="hero-section">
            <img src="Images/TheSnakeRoom.jpg" class="hero-image" alt="The Snake Room logo">

            <div class="container">
                <h1>The Snake Room</h1>
                <h2>Data Tools</h2>
            </div>
        </div>

        <div class="button-row">
            <a href="index.html" class="main-button">Home</a>
            <a href="snakes.html" class="main-button">Collection</a>
            <a href="breeding.html" class="main-button">Breeding</a>
            <a href="bin-cards.html" class="main-button">Bin Cards</a>
        </div>

        <div class="divider"></div>

        <main class="snake-form-page">
            <section class="form-section">
                <h3>Export</h3>

                <div class="data-action-grid">
                    <button type="button" class="main-button" id="exportSnakesButton">
                        Export CSV
                    </button>

                    <button type="button" class="secondary-button" id="templateButton">
                        CSV Template
                    </button>
                </div>

                <p class="empty-message">
                    CSV files open cleanly in LibreOffice Calc. Keep the header row when editing.
                </p>
            </section>

            <section class="form-section">
                <h3>Import</h3>

                <div class="form-grid">
                    <label class="form-field">
                        <span>CSV File</span>
                        <input type="file" id="csvFileInput" accept=".csv,text/csv">
                    </label>

                    <label class="form-field checkbox-field">
                        <span>Replace Collection</span>
                        <input type="checkbox" id="replaceCollectionInput">
                    </label>
                </div>

                <div class="form-page-actions">
                    <button type="button" class="main-button" id="importButton">
                        Import CSV
                    </button>
                </div>

                <div class="import-report" id="importReport"></div>
            </section>
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="data-helpers.js"></script>
    <script src="cloud-sync.js?v=5"></script>
    <script src="auto-sync.js?v=1"></script>
    <script src="data-tools.js"></script>
    <script>if ("serviceWorker" in navigator) { navigator.serviceWorker.register("sw.js").catch(function () {}); }</script>
</body>

</html>
