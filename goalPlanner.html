<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a0a0a">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Snake Room - Goal Planner</title>
    <link rel="stylesheet" href="style.css?v=15">
</head>

<body>
    <div class="page-container">
        <div class="hero-section">
            <img src="Images/TheSnakeRoom.jpg" class="hero-image" alt="The Snake Room logo">

            <div class="container">
                <h1>The Snake Room</h1>
                <h2>Goal Planner</h2>
            </div>
        </div>

        <div class="button-row">
            <a href="index.html" class="main-button">Home</a>
            <a href="snakes.html" class="main-button">Collection</a>
            <a href="breeding.html" class="main-button">Breeding</a>
            <a href="morphCalculator.html" class="main-button">Morph Calculator</a>
        </div>

        <div class="divider"></div>

        <main class="snake-form-page">

            <section class="form-section">
                <h3>Your Goals</h3>

                <div class="goal-create-row">
                    <input type="text" id="goalInput" class="goal-input"
                        placeholder="Enter a goal morph, e.g. Batman">
                    <button class="main-button" onclick="createGoal()">Plan This Goal</button>
                </div>

                <div id="goalCreationPanel" class="goal-creation-panel" style="display: none;"></div>

                <div id="goalList" class="goal-list"></div>
            </section>

            <section class="form-section" id="goalDetailSection" style="display: none;">
                <div id="goalDetail"></div>
            </section>

        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="data-helpers.js"></script>
    <script src="cloud-sync.js?v=5"></script>
    <script src="auto-sync.js?v=1"></script>
    <script src="geneCatalog.js?v=3"></script>
    <script src="genes.js?v=3"></script>
    <script src="morphCalculator.js?v=3"></script>
    <script src="goalPlanner.js?v=3"></script>
    <script>if ("serviceWorker" in navigator) { navigator.serviceWorker.register("sw.js").catch(function () {}); }</script>
</body>

</html>
