<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Snake Room - Weight Sheet</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="page-container weight-sheet-page">
        <div class="hero-section print-hidden">
            <img src="Images/TheSnakeRoom.jpg" class="hero-image" alt="The Snake Room logo">

            <div class="container">
                <h1>The Snake Room</h1>
                <h2>Weight Sheet</h2>
            </div>
        </div>

        <div class="button-row print-hidden">
            <a href="index.html" class="main-button">Home</a>
            <a href="snakes.html" class="main-button">Collection</a>
            <a href="data-tools.html" class="main-button">Data Tools</a>
            <a href="cloud-sync.html" class="main-button">Cloud Sync</a>
        </div>

        <div class="divider print-hidden"></div>

        <section class="form-section print-hidden">
            <h3>Print Setup</h3>

            <div class="bin-card-controls">
                <label class="form-field">
                    <span>Sort By</span>
                    <select id="weightSortInput">
                        <option value="name">Name</option>
                        <option value="binNumber">Bin Number</option>
                    </select>
                </label>

                <label class="form-field">
                    <span>Sex</span>
                    <select id="weightSexFilter">
                        <option value="All">All Snakes</option>
                        <option value="Female">Females</option>
                        <option value="Male">Males</option>
                        <option value="Unknown">Unknown Sex</option>
                    </select>
                </label>

                <label class="form-field">
                    <span>Status</span>
                    <select id="weightStatusFilter">
                        <option value="All">All Statuses</option>
                        <option value="Hatchling">Hatchling</option>
                        <option value="Holdback">Holdback</option>
                        <option value="Breeder">Breeder</option>
                        <option value="Available">Available</option>
                        <option value="On Hold">On Hold</option>
                        <option value="Sold">Sold</option>
                    </select>
                </label>

                <div class="form-field">
                    <span>&nbsp;</span>
                    <button type="button" class="main-button" id="printWeightSheetButton">
                        Print Sheet
                    </button>
                </div>
            </div>
        </section>

        <main class="weight-print-sheet">
            <div class="weight-sheet-heading">
                <h3>Snake Weight Log</h3>
                <span id="weightSheetDate"></span>
            </div>

            <table class="weight-sheet-table">
                <thead>
                    <tr>
                        <th>Bin</th>
                        <th>Sex</th>                        
                        <th>Name</th>
                        <th>Genes</th>
                        <th>Last Weight</th>
                        <th>New Weight</th>
                    </tr>
                </thead>
                <tbody id="weightSheetBody"></tbody>
            </table>
        </main>
    </div>

    <script src="data-helpers.js"></script>
    <script src="weight-sheet.js"></script>
</body>

</html>
